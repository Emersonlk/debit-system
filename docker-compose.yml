services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debit-system-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - debit-system-network

  mysql:
    image: mysql:8.0
    container_name: debit-system-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$DB_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - debit-system-network

  redis:
    image: redis:7-alpine
    container_name: debit-system-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - debit-system-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debit-system-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - debit-system-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: debit-system-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - debit-system-network

volumes:
  mysql_data:
  redis_data:
  vendor_data:

networks:
  debit-system-network:
    driver: bridge
